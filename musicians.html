<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musicians Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .stage {
            position: relative;
            width: 900px;
            height: 500px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 20px;
        }

        /* Spotlight effect */
        .stage::before {
            content: '';
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            height: 200px;
            background: radial-gradient(ellipse at center, rgba(255, 200, 100, 0.12) 0%, transparent 70%);
            pointer-events: none;
        }

        /* Floor reflection */
        .stage::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 40px;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.04) 0%, transparent 70%);
            border-radius: 50%;
        }

        .musician {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Musician body - simple geometric shapes */
        .body {
            position: relative;
            width: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .head {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            position: relative;
            z-index: 2;
            margin-bottom: -4px;
        }

        .torso {
            width: 44px;
            height: 60px;
            border-radius: 8px 8px 4px 4px;
            position: relative;
            z-index: 1;
        }

        .legs {
            display: flex;
            gap: 4px;
            margin-top: -2px;
        }

        .leg {
            width: 16px;
            height: 50px;
            border-radius: 0 0 4px 4px;
        }

        /* ========== CONDUCTOR ========== */
        .conductor {
            z-index: 10;
            margin-bottom: 20px;
        }

        .conductor .head { background: #e8b89d; }
        .conductor .torso { background: #2d2d2d; width: 48px; height: 65px; }
        .conductor .leg { background: #1a1a1a; }

        .conductor .baton {
            position: absolute;
            top: 20px;
            right: -30px;
            width: 3px;
            height: 50px;
            background: #f5f5f5;
            border-radius: 2px;
            transform-origin: bottom center;
            animation: conduct 1.6s ease-in-out infinite;
            z-index: 5;
        }

        .conductor .arm-right {
            position: absolute;
            top: 8px;
            right: -8px;
            width: 35px;
            height: 10px;
            background: #2d2d2d;
            border-radius: 5px;
            transform-origin: left center;
            animation: armConduct 1.6s ease-in-out infinite;
            z-index: 3;
        }

        .conductor .arm-left {
            position: absolute;
            top: 14px;
            left: -12px;
            width: 30px;
            height: 10px;
            background: #2d2d2d;
            border-radius: 5px;
            transform-origin: right center;
            animation: armConductLeft 1.6s ease-in-out infinite;
            z-index: 3;
        }

        @keyframes conduct {
            0%, 100% { transform: rotate(-30deg); }
            25% { transform: rotate(15deg); }
            50% { transform: rotate(-20deg); }
            75% { transform: rotate(25deg); }
        }

        @keyframes armConduct {
            0%, 100% { transform: rotate(-15deg); }
            25% { transform: rotate(10deg); }
            50% { transform: rotate(-10deg); }
            75% { transform: rotate(20deg); }
        }

        @keyframes armConductLeft {
            0%, 100% { transform: rotate(10deg); }
            50% { transform: rotate(-15deg); }
        }

        /* ========== VIOLINIST ========== */
        .violinist .head { background: #d4956b; }
        .violinist .torso { background: #c0392b; }
        .violinist .leg { background: #922b21; }

        .violinist .violin {
            position: absolute;
            top: 5px;
            left: -20px;
            z-index: 4;
        }

        .violinist .violin-body {
            width: 28px;
            height: 40px;
            background: #8B4513;
            border-radius: 40% 40% 45% 45%;
            position: relative;
            transform: rotate(30deg);
            animation: violinSway 1.6s ease-in-out infinite;
        }

        .violinist .violin-body::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 18px;
            border: 2px solid #5a2d0c;
            border-radius: 50%;
            background: transparent;
        }

        .violinist .bow {
            position: absolute;
            top: 0;
            left: 18px;
            width: 2px;
            height: 55px;
            background: #d4a76a;
            transform-origin: top center;
            animation: bowMove 0.8s ease-in-out infinite alternate;
        }

        .violinist .arm {
            position: absolute;
            top: 10px;
            left: -10px;
            width: 30px;
            height: 9px;
            border-radius: 5px;
            transform-origin: right center;
            animation: violinArm 0.8s ease-in-out infinite alternate;
        }

        .violinist .arm { background: #c0392b; }

        @keyframes violinSway {
            0%, 100% { transform: rotate(28deg); }
            50% { transform: rotate(33deg); }
        }

        @keyframes bowMove {
            0% { transform: rotate(-8deg); }
            100% { transform: rotate(8deg); }
        }

        @keyframes violinArm {
            0% { transform: rotate(-5deg); }
            100% { transform: rotate(5deg); }
        }

        /* ========== CELLIST ========== */
        .cellist .head { background: #f0c8a0; }
        .cellist .torso { background: #2980b9; }
        .cellist .leg { background: #1f618d; }

        .cellist .cello {
            position: absolute;
            top: 15px;
            right: -22px;
            z-index: 4;
        }

        .cellist .cello-body {
            width: 32px;
            height: 55px;
            background: #a0522d;
            border-radius: 35% 35% 45% 45%;
            position: relative;
        }

        .cellist .cello-body::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 20px;
            border: 2px solid #5a2d0c;
            border-radius: 50%;
            background: transparent;
        }

        .cellist .cello-neck {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 35px;
            background: #8B4513;
            border-radius: 2px;
        }

        .cellist .cello-bow {
            position: absolute;
            top: 8px;
            left: -10px;
            width: 2px;
            height: 50px;
            background: #d4a76a;
            transform-origin: top center;
            animation: celloBow 1.2s ease-in-out infinite alternate;
        }

        .cellist .arm {
            position: absolute;
            top: 10px;
            right: -10px;
            width: 28px;
            height: 9px;
            background: #2980b9;
            border-radius: 5px;
            transform-origin: left center;
            animation: celloArm 1.2s ease-in-out infinite alternate;
        }

        @keyframes celloBow {
            0% { transform: rotate(-6deg); }
            100% { transform: rotate(6deg); }
        }

        @keyframes celloArm {
            0% { transform: rotate(-4deg); }
            100% { transform: rotate(4deg); }
        }

        /* ========== PIANIST ========== */
        .pianist .head { background: #c9a07a; }
        .pianist .torso { background: #8e44ad; }
        .pianist .leg { background: #6c3483; }

        .pianist .piano {
            position: absolute;
            top: 25px;
            left: -45px;
            z-index: 0;
        }

        .pianist .piano-body {
            width: 80px;
            height: 35px;
            background: #1a1a1a;
            border-radius: 3px;
            position: relative;
            overflow: hidden;
        }

        .pianist .keys {
            position: absolute;
            bottom: 0;
            left: 4px;
            display: flex;
            gap: 1px;
            height: 14px;
        }

        .pianist .key {
            width: 6px;
            height: 14px;
            background: #f5f5f5;
            border-radius: 0 0 1px 1px;
        }

        .pianist .key.black {
            width: 4px;
            height: 9px;
            background: #1a1a1a;
            margin: 0 -2px;
            z-index: 1;
            position: relative;
        }

        .pianist .piano-leg-l, .pianist .piano-leg-r {
            position: absolute;
            bottom: -30px;
            width: 4px;
            height: 30px;
            background: #1a1a1a;
        }

        .pianist .piano-leg-l { left: 6px; }
        .pianist .piano-leg-r { right: 6px; }

        .pianist .arm-l, .pianist .arm-r {
            position: absolute;
            top: 12px;
            width: 25px;
            height: 9px;
            background: #8e44ad;
            border-radius: 5px;
            z-index: 3;
        }

        .pianist .arm-l {
            left: -14px;
            transform-origin: right center;
            animation: pianoArmL 0.4s ease-in-out infinite alternate;
        }

        .pianist .arm-r {
            right: -14px;
            transform-origin: left center;
            animation: pianoArmR 0.35s ease-in-out infinite alternate;
        }

        @keyframes pianoArmL {
            0% { transform: rotate(3deg); }
            100% { transform: rotate(-5deg); }
        }

        @keyframes pianoArmR {
            0% { transform: rotate(-3deg); }
            100% { transform: rotate(5deg); }
        }

        /* Pianist subtle body sway */
        .pianist .body {
            animation: pianistSway 2s ease-in-out infinite;
        }

        @keyframes pianistSway {
            0%, 100% { transform: rotate(-1deg); }
            50% { transform: rotate(1deg); }
        }

        /* ========== DRUMMER ========== */
        .drummer .head { background: #e0a87c; }
        .drummer .torso { background: #e67e22; }
        .drummer .leg { background: #ca6f1e; }

        .drummer .drums {
            position: absolute;
            top: 30px;
            left: -30px;
            z-index: 0;
        }

        .drummer .snare {
            width: 40px;
            height: 22px;
            background: #cd6155;
            border-radius: 4px;
            border: 2px solid #b03a2e;
            position: absolute;
            top: 0;
            left: 0;
        }

        .drummer .tom {
            width: 34px;
            height: 20px;
            background: #cd6155;
            border-radius: 4px;
            border: 2px solid #b03a2e;
            position: absolute;
            top: -10px;
            left: 44px;
        }

        .drummer .cymbal {
            width: 36px;
            height: 4px;
            background: #f0c040;
            border-radius: 50%;
            position: absolute;
            top: -24px;
            left: 50px;
            animation: cymbalShimmer 0.3s ease-in-out infinite alternate;
        }

        .drummer .cymbal-stand {
            width: 2px;
            height: 30px;
            background: #888;
            position: absolute;
            top: -20px;
            left: 66px;
        }

        .drummer .stick-l, .drummer .stick-r {
            position: absolute;
            width: 2px;
            height: 30px;
            background: #d4a76a;
            border-radius: 1px;
            z-index: 5;
        }

        .drummer .stick-l {
            top: -18px;
            left: 15px;
            transform-origin: bottom center;
            animation: drumStickL 0.3s ease-in-out infinite alternate;
        }

        .drummer .stick-r {
            top: -22px;
            left: 55px;
            transform-origin: bottom center;
            animation: drumStickR 0.25s ease-in-out infinite alternate;
        }

        .drummer .arm-l, .drummer .arm-r {
            position: absolute;
            width: 25px;
            height: 9px;
            background: #e67e22;
            border-radius: 5px;
            z-index: 3;
        }

        .drummer .arm-l {
            top: 8px;
            left: -14px;
            transform-origin: right center;
            animation: drumArmL 0.3s ease-in-out infinite alternate;
        }

        .drummer .arm-r {
            top: 8px;
            right: -14px;
            transform-origin: left center;
            animation: drumArmR 0.25s ease-in-out infinite alternate;
        }

        @keyframes drumStickL {
            0% { transform: rotate(-15deg); }
            100% { transform: rotate(5deg); }
        }

        @keyframes drumStickR {
            0% { transform: rotate(-10deg); }
            100% { transform: rotate(10deg); }
        }

        @keyframes drumArmL {
            0% { transform: rotate(-8deg); }
            100% { transform: rotate(4deg); }
        }

        @keyframes drumArmR {
            0% { transform: rotate(-5deg); }
            100% { transform: rotate(8deg); }
        }

        @keyframes cymbalShimmer {
            0% { opacity: 0.8; background: #f0c040; }
            100% { opacity: 1; background: #f7d96e; }
        }

        /* ========== TRUMPET PLAYER ========== */
        .trumpet-player .head { background: #d4a373; }
        .trumpet-player .torso { background: #27ae60; }
        .trumpet-player .leg { background: #1e8449; }

        .trumpet-player .trumpet {
            position: absolute;
            top: 2px;
            right: -40px;
            z-index: 4;
        }

        .trumpet-player .trumpet-tube {
            width: 40px;
            height: 8px;
            background: linear-gradient(to right, #d4af37, #f0d060);
            border-radius: 4px;
            position: relative;
        }

        .trumpet-player .trumpet-bell {
            position: absolute;
            right: -14px;
            top: -6px;
            width: 18px;
            height: 20px;
            background: linear-gradient(to right, #d4af37, #f0d060);
            border-radius: 0 60% 60% 0;
        }

        .trumpet-player .trumpet-valves {
            position: absolute;
            top: -6px;
            left: 10px;
            display: flex;
            gap: 3px;
        }

        .trumpet-player .valve {
            width: 4px;
            height: 6px;
            background: #b8960c;
            border-radius: 1px;
        }

        .trumpet-player .valve:nth-child(1) { animation: valvePress 0.6s ease-in-out infinite; }
        .trumpet-player .valve:nth-child(2) { animation: valvePress 0.6s ease-in-out 0.15s infinite; }
        .trumpet-player .valve:nth-child(3) { animation: valvePress 0.6s ease-in-out 0.3s infinite; }

        .trumpet-player .arm {
            position: absolute;
            top: 6px;
            right: -10px;
            width: 28px;
            height: 9px;
            background: #27ae60;
            border-radius: 5px;
            z-index: 3;
        }

        /* Trumpet player sway */
        .trumpet-player .body {
            animation: trumpetSway 1.6s ease-in-out infinite;
        }

        @keyframes valvePress {
            0%, 70%, 100% { transform: translateY(0); }
            35% { transform: translateY(3px); }
        }

        @keyframes trumpetSway {
            0%, 100% { transform: rotate(-1.5deg); }
            50% { transform: rotate(1.5deg); }
        }

        /* ========== SINGER ========== */
        .singer .head { background: #c68c53; }
        .singer .torso { background: #e74c8b; }
        .singer .leg { background: #c0397a; }

        .singer .microphone {
            position: absolute;
            top: -10px;
            right: -20px;
            z-index: 5;
        }

        .singer .mic-head {
            width: 12px;
            height: 14px;
            background: #555;
            border-radius: 6px 6px 2px 2px;
            position: relative;
        }

        .singer .mic-head::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 8px;
            height: 8px;
            background: repeating-linear-gradient(
                0deg,
                #666 0px,
                #666 1px,
                #777 1px,
                #777 2px
            );
            border-radius: 4px 4px 0 0;
        }

        .singer .mic-stand {
            width: 3px;
            height: 60px;
            background: #666;
            margin-left: 4.5px;
        }

        .singer .mic-base {
            width: 24px;
            height: 4px;
            background: #555;
            border-radius: 2px;
            margin-left: -6px;
        }

        /* Singing body sway */
        .singer .body {
            animation: singerSway 1.2s ease-in-out infinite;
        }

        @keyframes singerSway {
            0%, 100% { transform: rotate(-2deg) translateY(0); }
            25% { transform: rotate(1deg) translateY(-3px); }
            50% { transform: rotate(2deg) translateY(0); }
            75% { transform: rotate(-1deg) translateY(-2px); }
        }

        /* Sound waves from singer */
        .singer .sound-waves {
            position: absolute;
            top: -5px;
            right: -45px;
            z-index: 6;
        }

        .singer .wave {
            width: 8px;
            height: 8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            position: absolute;
            animation: soundWave 1.5s ease-out infinite;
        }

        .singer .wave:nth-child(1) { animation-delay: 0s; }
        .singer .wave:nth-child(2) { animation-delay: 0.5s; }
        .singer .wave:nth-child(3) { animation-delay: 1s; }

        @keyframes soundWave {
            0% {
                transform: scale(0.5);
                opacity: 0.8;
            }
            100% {
                transform: scale(3);
                opacity: 0;
            }
        }

        /* ========== MUSIC NOTES ========== */
        .music-notes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .note {
            position: absolute;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.15);
            animation: floatNote 4s ease-in-out infinite;
        }

        .note:nth-child(1) { left: 10%; top: 40%; animation-delay: 0s; font-size: 16px; }
        .note:nth-child(2) { left: 25%; top: 30%; animation-delay: 0.8s; font-size: 22px; }
        .note:nth-child(3) { left: 45%; top: 20%; animation-delay: 1.6s; font-size: 18px; }
        .note:nth-child(4) { left: 65%; top: 35%; animation-delay: 2.4s; font-size: 14px; }
        .note:nth-child(5) { left: 80%; top: 25%; animation-delay: 3.2s; font-size: 20px; }
        .note:nth-child(6) { left: 55%; top: 45%; animation-delay: 1.2s; font-size: 16px; }
        .note:nth-child(7) { left: 35%; top: 15%; animation-delay: 2s; font-size: 24px; }
        .note:nth-child(8) { left: 75%; top: 50%; animation-delay: 0.4s; font-size: 18px; }

        @keyframes floatNote {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.2;
            }
            80% {
                opacity: 0.15;
            }
            100% {
                transform: translateY(-80px) rotate(15deg);
                opacity: 0;
            }
        }

        /* ========== TITLE ========== */
        .title {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: 300;
        }

        /* ========== PLATFORM / STAGE FLOOR ========== */
        .platform {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 860px;
            height: 6px;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.06), transparent);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="title">♪ L'Orchestre ♪</div>

        <!-- Floating music notes -->
        <div class="music-notes">
            <span class="note">♪</span>
            <span class="note">♫</span>
            <span class="note">♩</span>
            <span class="note">♬</span>
            <span class="note">♪</span>
            <span class="note">♫</span>
            <span class="note">♩</span>
            <span class="note">♬</span>
        </div>

        <!-- Violinist -->
        <div class="musician violinist">
            <div class="body">
                <div class="head"></div>
                <div class="torso">
                    <div class="arm"></div>
                    <div class="violin">
                        <div class="violin-body"></div>
                        <div class="bow"></div>
                    </div>
                </div>
                <div class="legs">
                    <div class="leg"></div>
                    <div class="leg"></div>
                </div>
            </div>
        </div>

        <!-- Cellist -->
        <div class="musician cellist">
            <div class="body">
                <div class="head"></div>
                <div class="torso">
                    <div class="arm"></div>
                    <div class="cello">
                        <div class="cello-neck"></div>
                        <div class="cello-body"></div>
                        <div class="cello-bow"></div>
                    </div>
                </div>
                <div class="legs">
                    <div class="leg"></div>
                    <div class="leg"></div>
                </div>
            </div>
        </div>

        <!-- Conductor -->
        <div class="musician conductor">
            <div class="body">
                <div class="head"></div>
                <div class="torso">
                    <div class="arm-right"></div>
                    <div class="arm-left"></div>
                    <div class="baton"></div>
                </div>
                <div class="legs">
                    <div class="leg"></div>
                    <div class="leg"></div>
                </div>
            </div>
        </div>

        <!-- Trumpet Player -->
        <div class="musician trumpet-player">
            <div class="body">
                <div class="head"></div>
                <div class="torso">
                    <div class="arm"></div>
                    <div class="trumpet">
                        <div class="trumpet-tube">
                            <div class="trumpet-bell"></div>
                            <div class="trumpet-valves">
                                <div class="valve"></div>
                                <div class="valve"></div>
                                <div class="valve"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="legs">
                    <div class="leg"></div>
                    <div class="leg"></div>
                </div>
            </div>
        </div>

        <!-- Pianist -->
        <div class="musician pianist">
            <div class="body">
                <div class="head"></div>
                <div class="torso">
                    <div class="arm-l"></div>
                    <div class="arm-r"></div>
                </div>
                <div class="legs">
                    <div class="leg"></div>
                    <div class="leg"></div>
                </div>
            </div>
            <div class="piano">
                <div class="piano-body">
                    <div class="keys">
                        <div class="key"></div>
                        <div class="key black"></div>
                        <div class="key"></div>
                        <div class="key black"></div>
