<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descary - Éditeur Graphique</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <h1 class="logo">Descary</h1>
        </div>
        <div class="header-center">
            <button id="undoBtn" class="header-btn" title="Annuler">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 7v6h6"></path>
                    <path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"></path>
                </svg>
            </button>
            <button id="redoBtn" class="header-btn" title="Refaire">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 7v6h-6"></path>
                    <path d="M3 17a9 9 0 019-9 9 9 0 016 2.3l3 2.7"></path>
                </svg>
            </button>
        </div>
        <div class="header-right">
            <button id="downloadPngBtn" class="btn-primary">Télécharger PNG</button>
            <button id="downloadJsonBtn" class="btn-secondary">Sauvegarder JSON</button>
            <input type="file" id="uploadJsonBtn" accept=".json" style="display: none;">
            <button id="uploadJsonLabel" class="btn-secondary">Charger JSON</button>
        </div>
    </header>

    <div class="main-container">
        <!-- Sidebar gauche - Outils -->
        <aside class="sidebar-left">
            <div class="toolbar">
                <h3 class="toolbar-title">Outils</h3>

                <button class="tool-btn active" data-tool="select" title="Sélectionner">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
                    </svg>
                    <span>Sélectionner</span>
                </button>

                <div class="toolbar-divider"></div>

                <button class="tool-btn" data-tool="text" title="Texte">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="4 7 4 4 20 4 20 7"></polyline>
                        <line x1="9" y1="20" x2="15" y2="20"></line>
                        <line x1="12" y1="4" x2="12" y2="20"></line>
                    </svg>
                    <span>Texte</span>
                </button>

                <button class="tool-btn" data-tool="rectangle" title="Rectangle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    </svg>
                    <span>Rectangle</span>
                </button>

                <button class="tool-btn" data-tool="circle" title="Cercle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                    </svg>
                    <span>Cercle</span>
                </button>

                <button class="tool-btn" data-tool="triangle" title="Triangle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 22h20L12 2z"></path>
                    </svg>
                    <span>Triangle</span>
                </button>

                <button class="tool-btn" data-tool="line" title="Ligne">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="19" x2="19" y2="5"></line>
                    </svg>
                    <span>Ligne</span>
                </button>

                <div class="toolbar-divider"></div>

                <button class="tool-btn" data-tool="image" title="Image">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                    <span>Image</span>
                </button>
                <input type="file" id="imageInput" accept="image/*" style="display: none;">
            </div>
        </aside>

        <!-- Zone de canvas principale -->
        <main class="canvas-container">
            <div class="canvas-wrapper">
                <canvas id="canvas" width="800" height="600"></canvas>
            </div>
        </main>

        <!-- Sidebar droite - Propriétés -->
        <aside class="sidebar-right">
            <div class="properties-panel">
                <h3 class="panel-title">Propriétés</h3>

                <div id="noSelection" class="no-selection">
                    <p>Sélectionnez un élément pour modifier ses propriétés</p>
                </div>

                <div id="propertiesContent" class="properties-content" style="display: none;">
                    <!-- Position -->
                    <div class="property-group">
                        <label class="property-label">Position</label>
                        <div class="property-row">
                            <div class="property-input-group">
                                <label>X</label>
                                <input type="number" id="propX" class="property-input">
                            </div>
                            <div class="property-input-group">
                                <label>Y</label>
                                <input type="number" id="propY" class="property-input">
                            </div>
                        </div>
                    </div>

                    <!-- Dimensions -->
                    <div class="property-group">
                        <label class="property-label">Dimensions</label>
                        <div class="property-row">
                            <div class="property-input-group">
                                <label>L</label>
                                <input type="number" id="propWidth" class="property-input">
                            </div>
                            <div class="property-input-group">
                                <label>H</label>
                                <input type="number" id="propHeight" class="property-input">
                            </div>
                        </div>
                    </div>

                    <!-- Rotation -->
                    <div class="property-group">
                        <label class="property-label">Rotation</label>
                        <input type="range" id="propRotation" min="0" max="360" value="0" class="property-slider">
                        <span id="rotationValue">0°</span>
                    </div>

                    <!-- Opacité -->
                    <div class="property-group">
                        <label class="property-label">Opacité</label>
                        <input type="range" id="propOpacity" min="0" max="100" value="100" class="property-slider">
                        <span id="opacityValue">100%</span>
                    </div>

                    <!-- Couleur de remplissage -->
                    <div class="property-group" id="fillColorGroup">
                        <label class="property-label">Couleur de remplissage</label>
                        <input type="color" id="propFillColor" value="#3b82f6" class="property-color">
                    </div>

                    <!-- Couleur de bordure -->
                    <div class="property-group" id="strokeColorGroup">
                        <label class="property-label">Couleur de bordure</label>
                        <input type="color" id="propStrokeColor" value="#000000" class="property-color">
                        <label class="property-label" style="margin-top: 8px;">Épaisseur</label>
                        <input type="range" id="propStrokeWidth" min="0" max="20" value="2" class="property-slider">
                        <span id="strokeWidthValue">2px</span>
                    </div>

                    <!-- Texte -->
                    <div class="property-group" id="textGroup" style="display: none;">
                        <label class="property-label">Texte</label>
                        <textarea id="propText" class="property-textarea" rows="3"></textarea>

                        <label class="property-label" style="margin-top: 8px;">Taille de police</label>
                        <input type="number" id="propFontSize" class="property-input" value="24">

                        <label class="property-label" style="margin-top: 8px;">Police</label>
                        <select id="propFontFamily" class="property-select">
                            <option value="Arial">Arial</option>
                            <option value="Helvetica">Helvetica</option>
                            <option value="Times New Roman">Times New Roman</option>
                            <option value="Courier New">Courier New</option>
                            <option value="Georgia">Georgia</option>
                            <option value="Verdana">Verdana</option>
                        </select>

                        <label class="property-label" style="margin-top: 8px;">Style</label>
                        <div class="property-row">
                            <button id="propBold" class="style-btn">B</button>
                            <button id="propItalic" class="style-btn">I</button>
                            <button id="propUnderline" class="style-btn">U</button>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="property-group">
                        <button id="deleteBtn" class="btn-danger">Supprimer l'élément</button>
                        <button id="duplicateBtn" class="btn-secondary">Dupliquer</button>
                    </div>

                    <!-- Ordre -->
                    <div class="property-group">
                        <label class="property-label">Ordre des calques</label>
                        <div class="property-row">
                            <button id="bringToFrontBtn" class="btn-secondary">Premier plan</button>
                            <button id="sendToBackBtn" class="btn-secondary">Arrière-plan</button>
                        </div>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <script src="app.js"></script>
</body>
</html>
